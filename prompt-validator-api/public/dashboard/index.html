<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DreamPics Admin — Trend Photos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Login -->
    <section id="login-screen" class="screen">
      <form id="login-form" class="login-card">
        <h1>DreamPics Admin</h1>
        <p class="muted">Trend Photos manager — private access only.</p>
        <label for="admin-key">Admin key (X-Admin-Key)</label>
        <input id="admin-key" type="password" autocomplete="off" placeholder="Paste your admin key" required />
        <label class="checkbox-row">
          <input id="remember-key" type="checkbox" checked />
          <span>Remember on this device</span>
        </label>
        <button type="submit" class="btn btn-primary">Unlock dashboard</button>
        <p id="login-error" class="error hidden"></p>
      </form>
    </section>

    <!-- Dashboard -->
    <section id="dashboard-screen" class="screen hidden">
      <header class="topbar">
        <div>
          <h1>Trend Photos</h1>
          <p class="muted" id="trend-count"></p>
        </div>
        <div class="topbar-actions">
          <button id="manage-categories-btn" class="btn">Categories</button>
          <button id="new-trend-btn" class="btn btn-primary">+ New trend</button>
          <button id="logout-btn" class="btn btn-ghost">Logout</button>
        </div>
      </header>

      <div id="category-chips" class="chips"></div>

      <div id="trend-list" class="trend-list"></div>
    </section>
  </div>

  <!-- Trend form modal -->
  <div id="trend-modal" class="modal hidden">
    <div class="modal-card">
      <header class="modal-header">
        <h2 id="trend-modal-title">New trend</h2>
        <button class="modal-close" data-close="trend-modal">&times;</button>
      </header>
      <form id="trend-form">
        <input type="hidden" id="f-id" />

        <div class="modal-body">
          <div class="field">
            <label for="f-title">Title *</label>
            <input id="f-title" type="text" maxlength="120" required />
          </div>

          <div class="field">
            <label for="f-category">Category *</label>
            <input id="f-category" type="text" list="category-options" maxlength="60" required />
            <datalist id="category-options"></datalist>
          </div>

          <div class="field">
            <label for="f-description">Description</label>
            <textarea id="f-description" rows="2" maxlength="1000"></textarea>
          </div>

          <div class="field">
            <label for="f-prompt">Prompt template *</label>
            <textarea id="f-prompt" rows="3" maxlength="4000" required></textarea>
          </div>

          <div class="field">
            <label for="f-negative">Negative prompt</label>
            <textarea id="f-negative" rows="2" maxlength="4000"></textarea>
          </div>

          <div class="row">
            <div class="field">
              <label for="f-aspect">Aspect ratio</label>
              <select id="f-aspect">
                <option value="1:1">1:1</option>
                <option value="16:9">16:9</option>
                <option value="9:16">9:16</option>
                <option value="4:5">4:5</option>
                <option value="3:4">3:4</option>
              </select>
            </div>
            <div class="field checkbox-field">
              <label class="checkbox-row">
                <input id="f-requiresPhoto" type="checkbox" checked />
                <span>Require a user photo</span>
              </label>
              <label class="checkbox-row">
                <input id="f-allowCustomPrompt" type="checkbox" />
                <span>Allow custom prompt</span>
              </label>
            </div>
          </div>

          <div class="field">
            <label>Preview image</label>
            <div id="thumbnail-preview" class="thumbnail-preview">
              <img id="thumbnail-img" class="hidden" alt="preview" />
            </div>
            <input id="f-file" type="file" accept="image/jpeg,image/png,image/webp" />
            <p class="muted">JPEG / PNG / WebP, up to 8MB. Uploading replaces the current image.</p>
            <div class="field">
              <label for="f-thumbnailUrl">…or paste an image URL</label>
              <input id="f-thumbnailUrl" type="url" placeholder="https://…" />
            </div>
          </div>

          <p id="trend-form-error" class="error hidden"></p>
        </div>

        <footer class="modal-footer">
          <button type="button" class="btn" data-close="trend-modal">Cancel</button>
          <button type="button" id="save-draft-btn" class="btn">Save draft</button>
          <button type="submit" class="btn btn-primary">Save &amp; publish</button>
        </footer>
      </form>
    </div>
  </div>

  <!-- Category modal -->
  <div id="category-modal" class="modal hidden">
    <div class="modal-card modal-sm">
      <header class="modal-header">
        <h2>Categories</h2>
        <button class="modal-close" data-close="category-modal">&times;</button>
      </header>
      <div class="modal-body">
        <form id="category-form" class="category-add">
          <input id="new-category-name" type="text" maxlength="60" placeholder="New category name" required />
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <ul id="category-list" class="category-list"></ul>
        <p id="category-error" class="error hidden"></p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
